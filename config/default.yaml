model:
  # Ultralytics downloads this on first use. Replace it with a local path later.
  path: yolov8n.pt
  # Height, width. The sprint's portable edge baseline is 320 x 256.
  imgsz: [256, 320]
  confidence: 0.25
  iou: 0.45
  # COCO class 0 = person.
  classes: [0]
  # null lets Ultralytics choose. Examples: cpu, mps, 0.
  device: null

motion:
  # Keep false for detector baseline/parity runs.
  # Set true when testing the motion gate.
  enabled: true

  width: 160
  height: 120

  # Grayscale intensity difference required
  # before a pixel counts as changed.
  pixel_threshold: 25

  # 192 pixels = 1% of 160x120.
  minimum_changed_area: 192

  # Prevent continuous movement from generating
  # a new motion event on every frame.
  cooldown_ms: 250

pipeline:
  # null processes the complete input. Useful for quick smoke tests when overridden.
  max_frames: null

output:
  directory: runs/detect
  save_annotated: true
  save_jsonl: true
  line_thickness: 2
