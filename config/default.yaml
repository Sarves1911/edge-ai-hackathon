model:
  # Ultralytics downloads this on first use. Replace it with a local path later.
  path: yolov8n.pt
  # Height, width. The sprint's portable edge baseline is 320 x 256.
  imgsz: [256, 320]
  confidence: 0.25
  iou: 0.45
  # COCO class 0 = person.
  classes: [0]
  # null lets Ultralytics choose. Examples: cpu, mps, 0.
  device: null

motion:
  # Keep false for detector baseline/parity runs.
  # Set true when testing the motion gate.
  enabled: false

  width: 160
  height: 120

  # Grayscale intensity difference required
  # before a pixel counts as changed.
  pixel_threshold: 25

  # 192 pixels = 1% of 160x120.
  minimum_changed_area: 192

  # Prevent continuous movement from generating
  # a new motion event on every frame.
  cooldown_ms: 250

scheduler:
  # "always" preserves the correctness/parity baseline. Use
  # config/adaptive.yaml or --mode adaptive to enable gated inference.
  mode: always

  # Adaptive mode runs at most this often while motion is active.
  active_interval_ms: 100

  # Continue frequent inference briefly after motion stops. This lets a
  # person enter, stop moving, and remain represented by a recent result.
  active_hold_ms: 1500

  # Safety poll while idle so a missed motion event cannot suppress
  # neural inference forever.
  idle_poll_ms: 2000

  # Always infer on initial frames before adaptive gating begins.
  startup_frames: 3

tracker:
  # YOLO owns semantic identification. Sparse optical flow only propagates
  # detector-created boxes between YOLO results.
  enabled: true
  max_corners_per_box: 40
  min_points: 4
  quality_level: 0.01
  min_distance: 5
  block_size: 7
  window_size: 21
  max_level: 3
  criteria_iterations: 20
  criteria_epsilon: 0.03
  max_point_residual: 12

  # Async results beyond either bound are dropped instead of being applied to
  # a much newer live frame. A fresh detector request is then scheduled.
  max_result_age_ms: 1000
  max_result_frame_gap: 30

pipeline:
  # Sequential mode is deterministic for images and recorded videos.
  # "latest" activates a one-slot drop-oldest buffer for live cameras only.
  live_capture_mode: sequential

  # Testing only: emulate a slower edge detector for backpressure sweeps.
  simulated_detector_delay_ms: 0

  # null processes the complete input. Useful for quick smoke tests when overridden.
  max_frames: null

output:
  directory: runs/detect
  save_annotated: true
  save_jsonl: true
  line_thickness: 2
