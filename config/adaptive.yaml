model:
  path: yolov8n.onnx
  imgsz: [256, 320]
  confidence: 0.25
  iou: 0.45
  classes: [0]
  device: cpu

motion:
  enabled: true
  width: 160
  height: 120
  pixel_threshold: 25
  minimum_changed_area: 192
  cooldown_ms: 250

scheduler:
  mode: adaptive
  active_interval_ms: 100
  active_hold_ms: 1500
  idle_poll_ms: 2000
  startup_frames: 3

tracker:
  enabled: true
  max_corners_per_box: 40
  min_points: 4
  quality_level: 0.01
  min_distance: 5
  block_size: 7
  window_size: 21
  max_level: 3
  criteria_iterations: 20
  criteria_epsilon: 0.03
  max_point_residual: 12
  max_result_age_ms: 1000
  max_result_frame_gap: 30

pipeline:
  live_capture_mode: latest
  simulated_detector_delay_ms: 0
  max_frames: null

output:
  directory: runs/adaptive
  save_annotated: true
  save_jsonl: true
  line_thickness: 2
